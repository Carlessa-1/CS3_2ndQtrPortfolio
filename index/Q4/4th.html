<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Encoding + mobile responsiveness -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Page info -->
  <title>My Website</title>
  <meta name="description" content="A simple Grade 9 template with favicon, meta tags, navigation, and footer.">
  <meta name="author" content="Carlessa Christiana Castaneda">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="4th.css">
  <link rel="icon" type="image/x-icon" href="favicon.jpg">

  <!-- Nav bar-->


  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Slackey&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

</head>

<body>
    <nav aria-label="Main navigation">
    <h1>Carlessa Castaneda, 9-Sodium, SY 2025-2026</h1>
    <h1 style="font-size: large; color: white;">Movie Rating</h1>
      
  </nav>
  <main>

    <h1>Add a movie!</h1>

    <form id="myForm">

<fieldset>
    <label>Title:
        <input required type="text" id="title">
    </label>

    <br>

    <label>Year:
        <input required type="number" id="year">
    </label>

    <br>

    <label>Genre:
        <select id="genre" required>
          <option value="horror">Horror</option>
          <option value="comedy">Comedy</option>
          <option value="action">Action</option>
          <option value="romance">Romance</option>
          <option value="mystery">Mystery</option>
          <option value="historical">Historical</option>
        </select>
      </label>
      
      <br>
<label>Cover Image:
  <input type="file" id="cover" accept="image/*">
</label>
<br>
      <!-- Add icon library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<div class="star-rating">
  <span class="fa fa-star" data-value="1"></span>
  <span class="fa fa-star" data-value="2"></span>
  <span class="fa fa-star" data-value="3"></span>
  <span class="fa fa-star" data-value="4"></span>
  <span class="fa fa-star" data-value="5"></span>
</div>

<br>

<button type="submit">Submit</button>
  </fieldset>

</form>
<div id="movieList">
<h1 id="movie"></h1>
</div>
  </main>

  <footer>

    <li><a href="index.html" aria-current="page">Home!</a></li>
    <p class="copyright">
      &copy; <span id="yur"></span> Carlessa Christiana. All rights reserved.
    </p>

    <script>

document.getElementById('yur').textContent = new Date().getFullYear();


const myForm = document.getElementById("myForm");
const titleInput = document.getElementById("title");
const genreInput = document.getElementById("genre");
const yearInput = document.getElementById("year");
const movieList = document.getElementById("movieList");
let selectedRating = 0;


const stars = document.querySelectorAll(".star-rating .fa-star");
stars.forEach((star, index) => {
  star.addEventListener("click", () => {
    selectedRating = index + 1;
    stars.forEach((s, i) => {
      s.classList.toggle("selected", i < selectedRating);
    });
  });
});

myForm.addEventListener("submit", function(e) {
  e.preventDefault();
  if (!confirm("Submit application?")) return;

  const coverInput = document.getElementById("cover");
  const file = coverInput.files[0];

  if (file) {
    const reader = new FileReader();
    reader.onload = function() {
      saveMovie(reader.result);
    };
    reader.readAsDataURL(file);
  } else {
    saveMovie(null); 
  }
});


function saveMovie(imageData) {

  let applications = JSON.parse(localStorage.getItem("applications")) || [];

  const title = titleInput.value;
  const year = yearInput.value;

  let existing = applications.find(app => 
    app.title === title && app.year === year
  );

  if (existing) {

    existing.ratingTotal += selectedRating;
    existing.ratingCount += 1;
    existing.rating = Math.round(existing.ratingTotal / existing.ratingCount);

    alert("Rating updated! Average recalculated.");

  } else {

    const data = {
      title: title,
      genre: genreInput.value,
      year: year,
      ratingTotal: selectedRating,
      ratingCount: 1,
      rating: selectedRating,
      cover: imageData
    };

    applications.push(data);
  }

  localStorage.setItem("applications", JSON.stringify(applications));

  renderMovies();

  myForm.reset();
  selectedRating = 0;
  stars.forEach(star => star.classList.remove("selected"));
}
function renderMovies(){

  movieList.innerHTML = "";

  const applications = JSON.parse(localStorage.getItem("applications")) || [];

  applications.forEach(app => {
    const card = createMovieCard(app);
    movieList.appendChild(card);
  });

}


function createMovieCard(app) {
  const card = document.createElement("div");
  card.classList.add("movieCard");

  let ratingStars = "";
  for (let i = 1; i <= 5; i++) {
    ratingStars += `<span class="fa fa-star ${i <= app.rating ? 'selected' : ''}"></span>`;
  }

  card.innerHTML = `
    ${app.cover ? `<img src="${app.cover}" alt="${app.title}" style="width:100%; border-radius:8px; margin-bottom:8px;">` : ''}
    <h3>${app.title}</h3>
    <p>(${app.year})</p>
    <p>Genre: ${app.genre}</p>
    <div class="star-rating">${ratingStars}</div>
    <button onclick="deleteMovie(this)">Delete</button>
  `;
  return card;
}

function deleteMovie(button) {

   if (!confirm(`Are you sure you want to delete ${button.parentElement.querySelector("h3").textContent}?`)) {
    return;
  }

  const card = button.parentElement;
  movieList.removeChild(card);

  let applications = JSON.parse(localStorage.getItem("applications")) || [];
  applications = applications.filter(app => app.title !== card.querySelector("h3").textContent);
  localStorage.setItem("applications", JSON.stringify(applications));
}

window.addEventListener("DOMContentLoaded", renderMovies);
    </script>

 

  </footer>

</body>

</html>
