 <section id="start" id="table" class="glass-card">
  <table>
    <tr class="rColor">
      <th>input</th><th>output</th>
    </tr>
    <tr class="rColor">
      <td colspan="2">Sample Data</td>
    </tr>
    <tr><td>2 1 10 10</td><td>NE</td></tr>
    <tr><td>2 1 -10 1</td><td>divisa</td></tr>
    <tr><td>2 1 0 33</td><td>NO</td></tr>
    <tr class="rColor">
      <td colspan="2">For current Input</td>
    </tr>
    <tr>
      <td id="in1">0 0 0 0</td>
      <td id="out1">divisa</td>
    </tr>
  </table>

</section>
  
<section id="input" class="glass-card liquid-gradient-green">
    <h2>Input</h2>

  <h4>Axis Reference:</h4>
  <input type="number" id="x0" placeholder="0">
  <input type="number" id="y0" placeholder="0">

  <h4>Point Coordinates:</h4>
  <input type="number" id="x" placeholder="x">
  <input type="number" id="y" placeholder="y">

   <button onclick="plotPoint(Number(x0.value),Number(y0.value),Number(x.value), Number(y.value))"> Plot </button>
</section>
  
<section id="output" class="glass-card">
  <h2>Output</h2>

  <div class="axis" id="coordinatePlane" class="coordinate-grid glass-card">
    <div id="xAxis"></div>
    <div id="yAxis"></div>
  </div>
</section>
