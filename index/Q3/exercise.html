<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blue Lock Club Application</title>
  <link rel="stylesheet" href="exercise.css" />
    <link rel="icon" type="image/x-icon" href="favicon.jpg">

      <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Slackey&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

</head>

<body>
  <nav>
    <h1>Carlessa Castaneda, 9-Sodium</h1>
    <a href="exercise2.html">Submissions</a>
  </nav>

  <main>
    <form id="myForm">
      <h2>Blue Lock Club Application</h2>
<fieldset>
      <label>Full Name:
        <input required type="text" id="fname">
      </label><br>

      <label>Student ID:
        <input required type="number" id="studentid">
      </label><br>

      <label>Birthday:
        <input required type="date" id="birthday">
      </label><br>

      <label>Email:
        <input required type="email" id="email">
      </label><br>
    </fieldset>

    <fieldset>

      <label>Phone:
        <input required type="text" id="phone">
      </label><br>

      <label>Grade:
        <select id="grade" required>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </label><br>

      Status:<br>
      <input type="radio" name="stats" value="extern" required> Extern
      <input type="radio" name="stats" value="intern"> Intern
      <br><br>

      <label>Club:
        <select id="club" onchange="showImg()" required>
          <option value="pxgjpg.jpg">Paris X Gen</option>
          <option value="ubers.jpg">Ubers</option>
          <option value="manshine.jpg">Manshine</option>
          <option value="bastard.jpg">Bastard München</option>
          <option value="barcha.jpg">FC Barcha</option>
        </select>
      </label><br>

      <img id="club-img" style="width:700px;"><br>

      <label>Reason:
        <textarea id="reason" required></textarea>
      </label><br>
</fieldset>
      <button type="submit">Submit</button>
      <button type="button" id="clear">Clear</button>
    </form>
  </main>
  <footer>

    <li style="text-decoration: none;"><a style="text-decoration: none;" href="index.html" aria-current="page" id="fix">Home!</a></li>
    <p class="copyright">
      &copy; <span id="year"></span> Carlessa Christiana. All rights reserved.
    </p>
  </footer>

<script>
const club = document.getElementById("club");
const clubImg = document.getElementById("club-img");
const myForm = document.getElementById("myForm");
const clearBtn = document.getElementById("clear");

function showImg() {
  clubImg.src = club.value;
}

clearBtn.onclick = () => {
  myForm.reset();
  clubImg.src = "";
};

const inputs = document.querySelectorAll("input, textarea, select");

inputs.forEach(input => {
  input.addEventListener("blur", () => {
    if (!input.checkValidity()) {
      input.classList.add("error");

      // remove shake so it can play again next time
      setTimeout(() => input.classList.remove("error"), 500);
    }
  });
});


myForm.addEventListener("submit", function(e) {
  e.preventDefault();

  if (!confirm("Submit application?")) return;

  const data = {
    name: fname.value,
    studentid: studentid.value,
    birthday: birthday.value,
    email: email.value,
    phone: phone.value,
    grade: grade.value,
    status: document.querySelector('input[name="stats"]:checked')?.value,
    club: club.value,
    reason: reason.value
  };

  let applications = JSON.parse(localStorage.getItem("applications")) || [];
  applications.push(data);
  localStorage.setItem("applications", JSON.stringify(applications));

  alert("Application sent.");
  myForm.reset();
  clubImg.src = "";
});
</script>

</body>
</html>
